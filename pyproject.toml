[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "templatepy"
version = "0.1.0"
description = "Interpolation-free stellar spectral template construction from multi-epoch échelle spectra"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["astronomy", "spectroscopy", "stellar templates", "NIRPS", "SPIRou", "radial velocity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "astropy>=5.3",
    "matplotlib>=3.7",
    "tqdm>=4.65",
    "numba>=0.57",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=23.0",
    "ruff>=0.1",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
]

[project.scripts]
templatepy = "template_nointerp:main"

[project.urls]
Homepage = "https://github.com/eartigau/templatepy"
Documentation = "https://eartigau.github.io/templatepy"
Repository = "https://github.com/eartigau/templatepy"
Issues = "https://github.com/eartigau/templatepy/issues"

[tool.setuptools.packages.find]
where = ["."]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W"]
